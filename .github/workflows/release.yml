name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Resolve release ref
        id: ref
        shell: pwsh
        env:
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:EVENT_TAG }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH, got '$tag'"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm test -- --run

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Validate package version matches tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')
          if ($packageVersion -ne $tagVersion) {
            throw "package.json version $packageVersion does not match tag $env:RELEASE_TAG"
          }

          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tauriVersion -ne $tagVersion) {
            throw "Tauri version $tauriVersion does not match tag $env:RELEASE_TAG"
          }

      - name: Build Windows installers
        run: npm run build:desktop

      - name: Upload release test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 5dmind-desktop-${{ steps.ref.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          name: 5DMind ${{ steps.ref.outputs.tag }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
