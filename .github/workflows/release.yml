name: Desktop and Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Resolve release ref
        id: ref
        shell: pwsh
        env:
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:EVENT_TAG }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH, got '$tag'"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm test -- --run

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Validate package version matches tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')
          if ($packageVersion -ne $tagVersion) {
            throw "package.json version $packageVersion does not match tag $env:RELEASE_TAG"
          }

          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tauriVersion -ne $tagVersion) {
            throw "Tauri version $tauriVersion does not match tag $env:RELEASE_TAG"
          }

          $cargoToml = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargoToml -notmatch '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"') {
            throw "Could not read src-tauri/Cargo.toml package version"
          }
          if ($Matches[1] -ne $tagVersion) {
            throw "Cargo.toml version $($Matches[1]) does not match tag $env:RELEASE_TAG"
          }

          $cargoLock = Get-Content src-tauri/Cargo.lock -Raw
          if ($cargoLock -notmatch '(?m)^name\s*=\s*"five-d-mind"\r?\nversion\s*=\s*"([^"]+)"') {
            throw "Could not read five-d-mind version from src-tauri/Cargo.lock"
          }
          if ($Matches[1] -ne $tagVersion) {
            throw "Cargo.lock version $($Matches[1]) does not match tag $env:RELEASE_TAG"
          }

      - name: Build Windows installers
        run: npm run build:desktop

      - name: Upload release test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 5dmind-desktop-${{ steps.ref.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          name: 5DMind ${{ steps.ref.outputs.tag }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    name: Build and publish Android release
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Resolve release ref
        id: ref
        shell: bash
        env:
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$EVENT_TAG}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH, got '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install Rust Android targets
        shell: bash
        run: |
          rustup target add aarch64-linux-android

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android target
        run: npx tauri android init --ci --skip-targets-install

      - name: Build Android APK and AAB
        run: npm run build:android

      - name: Upload Android test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 5dmind-android-${{ steps.ref.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

      - name: Publish Android assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
